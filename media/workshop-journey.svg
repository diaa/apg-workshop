<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Workshop Journey — 10 Steps</title>
  <desc id="desc">Deploy → Connect → Load Data → Break Workload → Admin &amp; Access → Protect → Monitor → Diagnose → Fix → Clean Up</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .sub{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .num{font:800 13px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .lbl{font:700 13px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .detail{font:500 11px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arr)}
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#f8fafc"/>
  <text x="32" y="38" class="title">Workshop Journey</text>
  <text x="32" y="58" class="sub">Follow these 10 steps from infrastructure deployment to teardown.</text>

  <!-- Row 1: steps 1–5 -->
  <!-- Step 1 — Deploy -->
  <rect x="32" y="82" width="200" height="90" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="58" cy="108" r="14" fill="#2563eb"/><text x="53" y="113" class="num">1</text>
  <text x="80" y="110" class="lbl">Deploy</text>
  <text x="80" y="128" class="detail">Bicep → PG Flex + jumpbox</text>
  <text x="80" y="142" class="detail">+ VNets, DNS, storage</text>

  <path d="M232 127 L262 127" class="line"/>

  <!-- Step 2 — Connect -->
  <rect x="264" y="82" width="200" height="90" rx="12" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
  <circle cx="290" cy="108" r="14" fill="#4f46e5"/><text x="285" y="113" class="num">2</text>
  <text x="312" y="110" class="lbl">Connect</text>
  <text x="312" y="128" class="detail">SSH to jumpbox → psql</text>
  <text x="312" y="142" class="detail">.pg_azure + .pgpass</text>

  <path d="M464 127 L494 127" class="line"/>

  <!-- Step 3 — Load Data -->
  <rect x="496" y="82" width="200" height="90" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="522" cy="108" r="14" fill="#7c3aed"/><text x="517" y="113" class="num">3</text>
  <text x="544" y="110" class="lbl">Load Data</text>
  <text x="544" y="128" class="detail">pg_restore orders_demo</text>
  <text x="544" y="142" class="detail">4 tables · 410K rows</text>

  <path d="M696 127 L726 127" class="line"/>

  <!-- Step 4 — Break Workload -->
  <rect x="728" y="82" width="200" height="90" rx="12" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  <circle cx="754" cy="108" r="14" fill="#db2777"/><text x="749" y="113" class="num">4</text>
  <text x="776" y="110" class="lbl">Break Workload</text>
  <text x="776" y="128" class="detail">6 heavy queries</text>
  <text x="776" y="142" class="detail">CPU + IOPS + temp spills</text>

  <path d="M928 127 L958 127" class="line"/>

  <!-- Step 5 — Admin & Access -->
  <rect x="960" y="82" width="200" height="90" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <circle cx="986" cy="108" r="14" fill="#16a34a"/><text x="981" y="113" class="num">5</text>
  <text x="1008" y="110" class="lbl">Admin &amp; Access</text>
  <text x="1008" y="128" class="detail">Roles, permissions, RBAC</text>
  <text x="1008" y="142" class="detail">PgBouncer pooling</text>

  <!-- Connector from row 1 to row 2 -->
  <path d="M1060 172 L1060 200 L100 200 L100 218" class="line" style="marker-end:url(#arr)"/>

  <!-- Row 2: steps 6–10 -->
  <!-- Step 6 — Protect -->
  <rect x="32" y="220" width="200" height="90" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <circle cx="58" cy="246" r="14" fill="#ea580c"/><text x="53" y="251" class="num">6</text>
  <text x="80" y="248" class="lbl">Protect</text>
  <text x="80" y="266" class="detail">Backup, replication, HA/DR</text>
  <text x="80" y="280" class="detail">Security, patching</text>

  <path d="M232 265 L262 265" class="line"/>

  <!-- Step 7 — Monitor -->
  <rect x="264" y="220" width="200" height="90" rx="12" fill="#fef9c3" stroke="#fde047" stroke-width="2"/>
  <circle cx="290" cy="246" r="14" fill="#ca8a04"/><text x="285" y="251" class="num">7</text>
  <text x="312" y="248" class="lbl">Monitor</text>
  <text x="312" y="266" class="detail">Azure Metrics, QPI, alerts</text>
  <text x="312" y="280" class="detail">DB profiling, PgBadger</text>

  <path d="M464 265 L494 265" class="line"/>

  <!-- Step 8 — Diagnose -->
  <rect x="496" y="220" width="200" height="90" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <circle cx="522" cy="246" r="14" fill="#dc2626"/><text x="517" y="251" class="num">8</text>
  <text x="544" y="248" class="lbl">Diagnose</text>
  <text x="544" y="266" class="detail">MVCC, statistics, EXPLAIN</text>
  <text x="544" y="280" class="detail">Parameter tuning</text>

  <path d="M696 265 L726 265" class="line"/>

  <!-- Step 9 — Fix -->
  <rect x="728" y="220" width="200" height="90" rx="12" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
  <circle cx="754" cy="246" r="14" fill="#0d9488"/><text x="749" y="251" class="num">9</text>
  <text x="776" y="248" class="lbl">Fix</text>
  <text x="776" y="266" class="detail">Index tuning lab</text>
  <text x="776" y="280" class="detail">Before → After comparison</text>

  <path d="M928 265 L958 265" class="line"/>

  <!-- Step 10 — Clean Up -->
  <rect x="960" y="220" width="200" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="986" cy="246" r="14" fill="#64748b"/><text x="979" y="251" class="num">10</text>
  <text x="1008" y="248" class="lbl">Clean Up</text>
  <text x="1008" y="266" class="detail">Delete resource group</text>
  <text x="1008" y="280" class="detail">Remove credentials</text>
</svg>
