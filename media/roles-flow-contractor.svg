<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="460" viewBox="0 0 1300 460" role="img" aria-labelledby="title desc">
  <title id="title">Contractor user NOINHERIT flow</title>
  <desc id="desc">Numbered flow showing that contractor_user must SET ROLE app_team to gain write access.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e293b" />
    </marker>
    <style>
      .title{font:700 26px 'Segoe UI',Arial,sans-serif; fill:#0f172a}
      .sub{font:500 15px 'Segoe UI',Arial,sans-serif; fill:#334155}
      .step{font:700 13px 'Segoe UI',Arial,sans-serif; fill:#fff}
      .h{font:700 16px 'Segoe UI',Arial,sans-serif; fill:#0f172a}
      .p{font:500 13px 'Segoe UI',Arial,sans-serif; fill:#334155}
      .card{stroke:#cbd5e1; stroke-width:2; rx:12}
      .line{stroke:#1e293b; stroke-width:2.6; fill:none; marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1300" height="460" fill="#fff7ed"/>
  <text x="28" y="44" class="title">Contractor Path (contractor_user)</text>
  <text x="28" y="68" class="sub">NOINHERIT pattern to enforce explicit elevation.</text>

  <rect x="40" y="130" width="230" height="210" class="card" fill="#fde68a"/>
  <circle cx="70" cy="162" r="16" fill="#d97706"/><text x="65" y="167" class="step">1</text>
  <text x="94" y="162" class="h">Admin creates</text>
  <text x="94" y="184" class="p">app_team (NOLOGIN)</text>

  <rect x="300" y="130" width="230" height="210" class="card" fill="#fee2e2"/>
  <circle cx="330" cy="162" r="16" fill="#dc2626"/><text x="325" y="167" class="step">2</text>
  <text x="354" y="162" class="h">contractor_user</text>
  <text x="354" y="184" class="p">LOGIN NOINHERIT</text>
  <text x="354" y="206" class="p">member of app_team</text>

  <rect x="560" y="130" width="230" height="210" class="card" fill="#fee2e2"/>
  <circle cx="590" cy="162" r="16" fill="#b91c1c"/><text x="585" y="167" class="step">3</text>
  <text x="614" y="162" class="h">Initial session</text>
  <text x="614" y="184" class="p">no write access yet</text>

  <rect x="820" y="130" width="230" height="210" class="card" fill="#fed7aa"/>
  <circle cx="850" cy="162" r="16" fill="#ea580c"/><text x="845" y="167" class="step">4</text>
  <text x="874" y="162" class="h">SET ROLE app_team</text>
  <text x="874" y="184" class="p">explicit activation</text>

  <rect x="1080" y="130" width="200" height="210" class="card" fill="#dcfce7"/>
  <circle cx="1110" cy="162" r="16" fill="#16a34a"/><text x="1105" y="167" class="step">5</text>
  <text x="1134" y="162" class="h">Effective Access</text>
  <text x="1134" y="184" class="p">SELECT/INSERT/</text>
  <text x="1134" y="204" class="p">UPDATE/DELETE</text>

  <path d="M270 235 L300 235" class="line"/>
  <path d="M530 235 L560 235" class="line"/>
  <path d="M790 235 L820 235" class="line"/>
  <path d="M1050 235 L1080 235" class="line"/>
</svg>