<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI,system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="grad-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Query Rewriting Decision Tree</text>

  <!-- Start node -->
  <rect x="270" y="50" width="180" height="40" rx="20" fill="#336791" stroke="#1e4976" stroke-width="1.5"/>
  <text x="360" y="75" text-anchor="middle" font-size="13" fill="white" font-weight="600">Slow Query?</text>

  <!-- Arrow down -->
  <line x1="360" y1="90" x2="360" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Correlated subquery? -->
  <rect x="240" y="120" width="240" height="36" rx="6" fill="url(#grad-blue)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="143" text-anchor="middle" font-size="12" fill="#1e3a5f">Correlated subquery (N+1 loops)?</text>

  <!-- Yes arrow right -->
  <line x1="480" y1="138" x2="540" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="132" font-size="10" fill="#16a34a" font-weight="600">Yes</text>
  <rect x="545" y="120" width="160" height="36" rx="6" fill="url(#grad-green)" stroke="#86efac" stroke-width="1.5"/>
  <text x="625" y="143" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">→ JOIN + GROUP BY</text>

  <!-- No arrow down -->
  <line x1="360" y1="156" x2="360" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="173" font-size="10" fill="#dc2626" font-weight="600">No</text>

  <!-- Decision: Top-N per group? -->
  <rect x="240" y="180" width="240" height="36" rx="6" fill="url(#grad-blue)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="203" text-anchor="middle" font-size="12" fill="#1e3a5f">Top-N per group (ROW_NUMBER)?</text>

  <line x1="480" y1="198" x2="540" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="192" font-size="10" fill="#16a34a" font-weight="600">Yes</text>
  <rect x="545" y="180" width="160" height="36" rx="6" fill="url(#grad-green)" stroke="#86efac" stroke-width="1.5"/>
  <text x="625" y="203" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">→ LATERAL + LIMIT</text>

  <line x1="360" y1="216" x2="360" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="233" font-size="10" fill="#dc2626" font-weight="600">No</text>

  <!-- Decision: SELECT * ? -->
  <rect x="240" y="240" width="240" height="36" rx="6" fill="url(#grad-blue)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="263" text-anchor="middle" font-size="12" fill="#1e3a5f">SELECT * with covering index?</text>

  <line x1="480" y1="258" x2="540" y2="258" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="252" font-size="10" fill="#16a34a" font-weight="600">Yes</text>
  <rect x="545" y="240" width="160" height="36" rx="6" fill="url(#grad-green)" stroke="#86efac" stroke-width="1.5"/>
  <text x="625" y="263" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">→ Explicit columns</text>

  <line x1="360" y1="276" x2="360" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="293" font-size="10" fill="#dc2626" font-weight="600">No</text>

  <!-- Decision: CTE referenced once? -->
  <rect x="240" y="300" width="240" height="36" rx="6" fill="url(#grad-blue)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="323" text-anchor="middle" font-size="12" fill="#1e3a5f">CTE with outer filter (PG 12+)?</text>

  <line x1="480" y1="318" x2="540" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="312" font-size="10" fill="#16a34a" font-weight="600">Yes</text>
  <rect x="545" y="300" width="160" height="36" rx="6" fill="url(#grad-green)" stroke="#86efac" stroke-width="1.5"/>
  <text x="625" y="323" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">→ Let planner inline</text>

  <line x1="360" y1="336" x2="360" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="353" font-size="10" fill="#dc2626" font-weight="600">No</text>

  <!-- Fallback -->
  <rect x="240" y="360" width="240" height="40" rx="6" fill="url(#grad-amber)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#78350f">Try indexes / parameter tuning /</text>
  <text x="360" y="393" text-anchor="middle" font-size="11" fill="#78350f">expression index / partitioning</text>

  <!-- Legend -->
  <rect x="15" y="55" width="12" height="12" rx="2" fill="url(#grad-blue)" stroke="#93c5fd"/>
  <text x="32" y="65" font-size="10" fill="#475569">Decision</text>
  <rect x="15" y="73" width="12" height="12" rx="2" fill="url(#grad-green)" stroke="#86efac"/>
  <text x="32" y="83" font-size="10" fill="#475569">Rewrite technique</text>
  <rect x="15" y="91" width="12" height="12" rx="2" fill="url(#grad-amber)" stroke="#fbbf24"/>
  <text x="32" y="101" font-size="10" fill="#475569">Other approaches</text>
</svg>
