<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Primary server -->
  <rect x="10" y="35" width="130" height="55" rx="8" fill="#336791"/>
  <text x="75" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Primary server</text>
  <text x="75" y="75" text-anchor="middle" font-size="10" fill="#a0c4e0">orders_demo</text>

  <!-- Arrow -->
  <line x1="140" y1="62" x2="175" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah4)"/>

  <!-- Publication -->
  <rect x="180" y="35" width="130" height="55" rx="8" fill="#ff8c00"/>
  <text x="245" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Publication</text>
  <text x="245" y="75" text-anchor="middle" font-size="10" fill="#ffe0b2">customers_pub</text>

  <!-- Arrow -->
  <line x1="310" y1="62" x2="345" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah4)"/>

  <!-- Subscription -->
  <rect x="350" y="35" width="130" height="55" rx="8" fill="#0078d4"/>
  <text x="415" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Subscription</text>
  <text x="415" y="75" text-anchor="middle" font-size="10" fill="#cce4f7">customers_sub</text>

  <!-- Arrow -->
  <line x1="480" y1="62" x2="515" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah4)"/>

  <!-- Replica server -->
  <rect x="520" y="35" width="130" height="55" rx="8" fill="#336791"/>
  <text x="585" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Replica server</text>
  <text x="585" y="75" text-anchor="middle" font-size="10" fill="#a0c4e0">orders_demo</text>

  <!-- Arrow -->
  <line x1="650" y1="62" x2="685" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah4)"/>

  <!-- Verify -->
  <rect x="690" y="35" width="100" height="55" rx="8" fill="#5bb350"/>
  <text x="740" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Read / verify</text>
  <text x="740" y="75" text-anchor="middle" font-size="10" fill="#d4ecd0">replicated rows</text>
</svg>
