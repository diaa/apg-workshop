<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="Segoe UI, Arial, sans-serif">
  <!-- Your Machine box -->
  <rect x="20" y="30" width="220" height="160" rx="12" fill="#e8f4fd" stroke="#0078d4" stroke-width="2"/>
  <text x="130" y="55" text-anchor="middle" font-size="13" fill="#555">🖥️ Your Machine</text>
  <rect x="45" y="70" width="170" height="100" rx="8" fill="#0078d4"/>
  <text x="130" y="110" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">VS Code / Terminal</text>
  <text x="130" y="132" text-anchor="middle" font-size="12" fill="#cce4f7">psql client</text>

  <!-- Arrow -->
  <defs>
    <marker id="ah1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <line x1="240" y1="120" x2="400" y2="120" stroke="#555" stroke-width="2" marker-end="url(#ah1)"/>
  <text x="320" y="108" text-anchor="middle" font-size="11" fill="#555">psql :5432</text>
  <text x="320" y="142" text-anchor="middle" font-size="10" fill="#888">TLS encrypted</text>

  <!-- Azure box -->
  <rect x="410" y="30" width="290" height="160" rx="12" fill="#fff4e5" stroke="#ff8c00" stroke-width="2"/>
  <text x="555" y="55" text-anchor="middle" font-size="13" fill="#555">☁️ Azure</text>
  <rect x="430" y="70" width="250" height="100" rx="8" fill="#336791"/>
  <text x="555" y="100" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">🐘 PostgreSQL Flexible Server</text>
  <text x="555" y="120" text-anchor="middle" font-size="11" fill="#a0c4e0">Public Endpoint :5432</text>
  <text x="555" y="140" text-anchor="middle" font-size="11" fill="#a0c4e0">Firewall: your IP allowed</text>
</svg>
