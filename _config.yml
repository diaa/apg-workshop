full_rebuild: true
name: "The Azure PostgreSQL Workshop"
tracking: "apgworkshop"
author: Microsoft
encoding: utf-8
url: "https://diaa.github.io"
baseurl: "/apg-workshop"
defaults:
  -
    values:
      layout: "index"
markdown: kramdown
kramdown:
  input: GFM
relative_permalinks: false
collections:
  entries:
    output: false
sass:
  sass_dir: _sass
  style: :compressed
exclude: [
.git,
.gitignore,
README.md,
.sass-cache
]
