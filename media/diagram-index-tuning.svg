<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 130" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah6" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Step 1: Run slow query -->
  <rect x="10" y="35" width="110" height="55" rx="8" fill="#d32f2f"/>
  <text x="65" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Run slow</text>
  <text x="65" y="75" text-anchor="middle" font-size="10" fill="#ffcdd2">query</text>

  <!-- Arrow -->
  <line x1="120" y1="62" x2="145" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah6)"/>

  <!-- Step 2: EXPLAIN ANALYZE -->
  <rect x="150" y="35" width="120" height="55" rx="8" fill="#7b2d8e"/>
  <text x="210" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">EXPLAIN</text>
  <text x="210" y="75" text-anchor="middle" font-size="10" fill="#d8b4e8">ANALYZE</text>

  <!-- Arrow -->
  <line x1="270" y1="62" x2="295" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah6)"/>

  <!-- Step 3: Identify missing index -->
  <rect x="300" y="35" width="120" height="55" rx="8" fill="#ff8c00"/>
  <text x="360" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Identify</text>
  <text x="360" y="75" text-anchor="middle" font-size="10" fill="#ffe0b2">missing index</text>

  <!-- Arrow -->
  <line x1="420" y1="62" x2="445" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah6)"/>

  <!-- Step 4: Create index -->
  <rect x="450" y="35" width="110" height="55" rx="8" fill="#0078d4"/>
  <text x="505" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Create</text>
  <text x="505" y="75" text-anchor="middle" font-size="10" fill="#cce4f7">index</text>

  <!-- Arrow -->
  <line x1="560" y1="62" x2="585" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah6)"/>

  <!-- Step 5: Re-run and compare -->
  <rect x="590" y="35" width="110" height="55" rx="8" fill="#336791"/>
  <text x="645" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Re-run &amp;</text>
  <text x="645" y="75" text-anchor="middle" font-size="10" fill="#a0c4e0">compare</text>

  <!-- Arrow -->
  <line x1="700" y1="62" x2="725" y2="62" stroke="#555" stroke-width="2" marker-end="url(#ah6)"/>

  <!-- Step 6: Keep if faster -->
  <rect x="730" y="35" width="80" height="55" rx="8" fill="#5bb350"/>
  <text x="770" y="57" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Keep ✓</text>
  <text x="770" y="75" text-anchor="middle" font-size="10" fill="#d4ecd0">if faster</text>
</svg>
