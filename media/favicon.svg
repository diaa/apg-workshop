    <circle cx="20" cy="15.5" r="1" fill="#fff"/>
    <!-- Tusk -->
    <path d="M12,24 Q10,28 13,27Z" fill="#e8e8e8"/>
    <!-- Legs -->
    <rect x="14" y="44" width="5" height="8" rx="2" fill="#fff"/>
