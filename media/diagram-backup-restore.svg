<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- orders_demo box -->
  <rect x="10" y="65" width="130" height="50" rx="8" fill="#336791"/>
  <text x="75" y="95" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">orders_demo</text>

  <!-- Arrow to decision -->
  <line x1="140" y1="90" x2="185" y2="90" stroke="#555" stroke-width="2" marker-end="url(#ah3)"/>

  <!-- Decision diamond -->
  <polygon points="240,55 295,90 240,125 185,90" fill="#ff8c00" stroke="#e07800" stroke-width="1.5"/>
  <text x="240" y="87" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Backup</text>
  <text x="240" y="100" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">format?</text>

  <!-- Plain SQL -->
  <line x1="240" y1="55" x2="240" y2="20" stroke="#555" stroke-width="2"/>
  <line x1="240" y1="20" x2="390" y2="20" stroke="#555" stroke-width="2" marker-end="url(#ah3)"/>
  <rect x="395" y="5" width="100" height="32" rx="6" fill="#5bb350"/>
  <text x="445" y="26" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Plain SQL</text>

  <!-- Custom Fc -->
  <line x1="295" y1="78" x2="395" y2="78" stroke="#555" stroke-width="2" marker-end="url(#ah3)"/>
  <rect x="395" y="60" width="100" height="32" rx="6" fill="#0078d4"/>
  <text x="445" y="81" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Custom -Fc</text>

  <!-- Directory Fd -->
  <line x1="295" y1="102" x2="395" y2="138" stroke="#555" stroke-width="2" marker-end="url(#ah3)"/>
  <rect x="395" y="122" width="100" height="32" rx="6" fill="#0078d4"/>
  <text x="445" y="143" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Directory -Fd</text>

  <!-- Arrows from Custom/Directory to pg_restore -->
  <line x1="495" y1="78" x2="555" y2="100" stroke="#555" stroke-width="2" marker-end="url(#ah3)"/>
  <line x1="495" y1="138" x2="555" y2="110" stroke="#555" stroke-width="2" marker-end="url(#ah3)"/>

  <!-- pg_restore box -->
  <rect x="560" y="85" width="100" height="36" rx="6" fill="#7b2d8e"/>
  <text x="610" y="108" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">pg_restore</text>

  <!-- Arrow to restored DB -->
  <line x1="660" y1="103" x2="685" y2="103" stroke="#555" stroke-width="2" marker-end="url(#ah3)"/>
  <rect x="690" y="78" width="100" height="50" rx="8" fill="#336791"/>
  <text x="740" y="100" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">orders_demo</text>
  <text x="740" y="116" text-anchor="middle" font-size="10" fill="#a0c4e0">_restored</text>
</svg>
